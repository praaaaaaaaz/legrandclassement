<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#0a0a0f"/>
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Jet silhouette -->
  <g transform="translate(50,50) rotate(-30) scale(0.85)">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="28" ry="7" fill="#fe2c55"/>
    <!-- Nose -->
    <polygon points="28,-4 28,4 48,0" fill="#ff6b6b"/>
    <!-- Main wings -->
    <polygon points="-5,-7 10,-7 18,-28 -8,-22" fill="#fe2c55"/>
    <polygon points="-5,7 10,7 18,28 -8,22" fill="#fe2c55"/>
    <!-- Tail wings -->
    <polygon points="-18,-7 -10,-7 -12,-18 -22,-14" fill="#c0392b"/>
    <polygon points="-18,7 -10,7 -12,18 -22,14" fill="#c0392b"/>
    <!-- Tail -->
    <polygon points="-20,-7 -28,-7 -32,-18 -16,-7" fill="#e74c3c"/>
    <!-- Engine glow -->
    <circle cx="-30" cy="0" r="5" fill="#ff9500" opacity="0.8"/>
    <circle cx="-30" cy="0" r="3" fill="#ffcc00"/>
  </g>
  <!-- Stars -->
  <circle cx="15" cy="20" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="82" cy="15" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="88" cy="75" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="12" cy="80" r="1" fill="#fff" opacity="0.5"/>
</svg>
